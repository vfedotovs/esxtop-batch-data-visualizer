<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>esxtop Batch Data Analyzer</title>
    <script>
        // Applied before first paint so a saved dark choice does not flash white.
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* private mode: fall back to the system preference */ }
        })();
    </script>
    <style>
        /* Light palette is the base. Dark is redefined twice: once for the
           system preference (guarded so an explicit light choice wins) and
           once for the explicit toggle. */
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --surface-alt: #f8f9fa;
            --text: #333333;
            --heading: #2c3e50;
            --muted: #7f8c8d;
            --border: #dddddd;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --accent-soft: #e3f2fd;
            --success: #4caf50;
            --success-soft: #e8f5e9;
            --download: #27ae60;
            --download-hover: #219a52;
            --error-bg: #ffebee;
            --error-text: #c62828;
            --disabled: #bdc3c7;
            --spinner-track: #f3f3f3;
            --shadow: rgba(0, 0, 0, 0.1);
            /* The console keeps its terminal look in both themes. */
            --console-bg: #1e1e1e;
            --console-text: #d4d4d4;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14171a;
                --surface: #1e2227;
                --surface-alt: #262b31;
                --text: #e4e6e8;
                --heading: #eaf2f8;
                --muted: #9aa4ad;
                --border: #333a42;
                --accent: #4aa3df;
                --accent-hover: #6bb6e8;
                --accent-soft: rgba(74, 163, 223, 0.16);
                --success: #5cb860;
                --success-soft: rgba(92, 184, 96, 0.16);
                --download: #2e9e5b;
                --download-hover: #35b268;
                --error-bg: rgba(198, 40, 40, 0.18);
                --error-text: #ff9a94;
                --disabled: #4a5058;
                --spinner-track: #333a42;
                --shadow: rgba(0, 0, 0, 0.5);
                --console-bg: #16191c;
                --console-text: #d4d4d4;
            }
        }
        :root[data-theme="dark"] {
            --bg: #14171a;
            --surface: #1e2227;
            --surface-alt: #262b31;
            --text: #e4e6e8;
            --heading: #eaf2f8;
            --muted: #9aa4ad;
            --border: #333a42;
            --accent: #4aa3df;
            --accent-hover: #6bb6e8;
            --accent-soft: rgba(74, 163, 223, 0.16);
            --success: #5cb860;
            --success-soft: rgba(92, 184, 96, 0.16);
            --download: #2e9e5b;
            --download-hover: #35b268;
            --error-bg: rgba(198, 40, 40, 0.18);
            --error-text: #ff9a94;
            --disabled: #4a5058;
            --spinner-track: #333a42;
            --shadow: rgba(0, 0, 0, 0.5);
            --console-bg: #16191c;
            --console-text: #d4d4d4;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--heading);
            margin: 0;
        }
        .theme-toggle {
            flex-shrink: 0;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .theme-toggle:hover {
            background: var(--surface-alt);
            border-color: var(--accent);
        }
        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow);
            margin-bottom: 20px;
        }
        .upload-area {
            border: 3px dashed var(--accent);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--surface-alt);
        }
        .upload-area:hover, .upload-area.dragover {
            background: var(--accent-soft);
            border-color: var(--accent-hover);
        }
        .upload-area.has-file {
            background: var(--success-soft);
            border-color: var(--success);
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        input[type="file"] {
            display: none;
        }
        .file-name {
            margin-top: 10px;
            font-weight: bold;
            color: var(--success);
        }
        .options {
            margin: 20px 0;
            padding: 20px;
            background: var(--surface-alt);
            border-radius: 8px;
        }
        .options label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
        }
        .options input[type="radio"] {
            margin-right: 10px;
        }
        #analyzeBtn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #analyzeBtn:hover {
            background: var(--accent-hover);
        }
        #analyzeBtn:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }
        .results {
            display: none;
        }
        .results.visible {
            display: block;
        }
        .output {
            background: var(--console-bg);
            color: var(--console-text);
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 600px;
            overflow-y: auto;
        }
        .files-list {
            margin-top: 20px;
        }
        .files-list h3 {
            margin-bottom: 10px;
        }
        .files-list a {
            display: inline-block;
            margin: 5px 10px 5px 0;
            padding: 8px 15px;
            background: var(--download);
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .files-list a:hover {
            background: var(--download-hover);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.visible {
            display: block;
        }
        .spinner {
            border: 4px solid var(--spinner-track);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .success-badge {
            background: var(--success);
            color: #ffffff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 10px;
        }
        .error-badge {
            background: #f44336;
            color: #ffffff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 10px;
        }
        footer {
            text-align: center;
            color: var(--muted);
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>esxtop Batch Data Analyzer</h1>
        <button type="button" class="theme-toggle" id="themeToggle"
                aria-label="Toggle dark mode"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span></button>
    </div>

    <div class="container">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p>Drag & drop your esxtop CSV file here</p>
            <p>or click to select file</p>
            <input type="file" id="fileInput" accept=".csv">
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="options">
            <h3>Analysis Type:</h3>
            <label>
                <input type="radio" name="analysis" value="both" checked>
                <strong>Both</strong> - VMDK and Physical Disk analysis
            </label>
            <label>
                <input type="radio" name="analysis" value="describe">
                <strong>VMDK Only</strong> - Virtual Disk latency (Average MilliSec/Read & Write)
            </label>
            <label>
                <input type="radio" name="analysis" value="describe-pdisk">
                <strong>Physical Disk Only</strong> - Physical Disk SCSI Device latency (naa.*)
            </label>
        </div>

        <button id="analyzeBtn" disabled>Analyze</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Analyzing esxtop data... This may take a few minutes for large files.</p>
    </div>

    <div class="results container" id="results">
        <h2>Analysis Results <span id="statusBadge"></span></h2>
        <div class="files-list" id="filesList"></div>
        <h3>Output:</h3>
        <div class="output" id="output"></div>
        <div class="error" id="errorDiv" style="display: none;"></div>
    </div>

    <footer>
        <p>esxtop Batch Data Visualizer v{{ version }}</p>
    </footer>

    <script>
        // --- Theme toggle -------------------------------------------------
        // No stored choice means "follow the system", so the button label is
        // derived from what is actually on screen rather than from storage.
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

        function currentTheme() {
            const explicit = document.documentElement.getAttribute('data-theme');
            if (explicit) return explicit;
            return systemDark.matches ? 'dark' : 'light';
        }

        function paintToggle() {
            const dark = currentTheme() === 'dark';
            // The button advertises what it switches *to*.
            themeIcon.textContent = dark ? '☀️' : '🌙';
            themeLabel.textContent = dark ? 'Light' : 'Dark';
            themeToggle.setAttribute('aria-pressed', String(dark));
        }

        themeToggle.addEventListener('click', () => {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
            paintToggle();
        });

        // Track the system preference while no explicit choice is stored.
        systemDark.addEventListener('change', () => {
            if (!document.documentElement.getAttribute('data-theme')) paintToggle();
        });

        paintToggle();

        // --- Upload and analysis -----------------------------------------
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const output = document.getElementById('output');
        const filesList = document.getElementById('filesList');
        const statusBadge = document.getElementById('statusBadge');
        const errorDiv = document.getElementById('errorDiv');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.endsWith('.csv')) {
                alert('Please select a CSV file');
                return;
            }
            selectedFile = file;
            fileName.textContent = `Selected: ${file.name} (${formatSize(file.size)})`;
            uploadArea.classList.add('has-file');
            analyzeBtn.disabled = false;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const analysisType = document.querySelector('input[name="analysis"]:checked').value;

            // Show loading
            loading.classList.add('visible');
            results.classList.remove('visible');
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('analysis_type', analysisType);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.classList.remove('visible');
                results.classList.add('visible');

                if (data.error) {
                    statusBadge.innerHTML = '<span class="error-badge">Error</span>';
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.error;
                    output.textContent = '';
                } else {
                    if (data.success) {
                        statusBadge.innerHTML = '<span class="success-badge">Success</span>';
                        errorDiv.style.display = 'none';
                    } else {
                        statusBadge.innerHTML = '<span class="error-badge">Completed with errors</span>';
                        if (data.errors && data.errors.length > 0) {
                            errorDiv.style.display = 'block';
                            errorDiv.textContent = data.errors.join('\n');
                        }
                    }

                    output.textContent = data.output || 'No output generated';

                    // Show downloadable files
                    if (data.files && data.files.length > 0) {
                        let filesHtml = '<h3>Generated Files:</h3>';
                        data.files.forEach(file => {
                            filesHtml += `<a href="/download/${data.output_dir}/${file}" target="_blank">${file}</a>`;
                        });
                        filesList.innerHTML = filesHtml;
                    } else {
                        filesList.innerHTML = '';
                    }
                }
            } catch (err) {
                loading.classList.remove('visible');
                results.classList.add('visible');
                statusBadge.innerHTML = '<span class="error-badge">Error</span>';
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Failed to connect to server: ' + err.message;
            }

            analyzeBtn.disabled = false;
        });
    </script>
</body>
</html>
